name: E2E Nightly (full suite)

# 감사 2026-07 §4.2(R3): 14개 Playwright 스펙 중 smoke 1개만 CI 게이트였다.
# (2026-08-26) color-themes·design-harmonization은 **PR 게이트로 승격**됐다 — 이 둘을
# 고칠 때 nightly를 수동으로 돌릴 필요가 없다. nightly가 여전히 유일하게 덮는 것은
# 프록시 모드와 나머지 여정 스펙이다.
# 나머지(auth-recovery·data-export-import·oauth·pr-history·workout-log-rpe·
# stats-1rm-async-continuity·design-harmonization 등)를 nightly로 편입해 커버리지
# 공백을 표면화한다. PR 게이트에는 넣지 않는다(비침습) — 실패는 트리아지 대상이며
# 병합 파이프라인을 막지 않는다. 일부 스펙은 기능 플래그/OAuth 미설정 시 skip될 수 있다.
on:
  schedule:
    - cron: "0 18 * * *" # 매일 03:00 KST (UTC 18:00)
  workflow_dispatch: {}

concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-full:
    name: E2E Full Suite
    runs-on: ubuntu-latest
    # 전체 스위트는 실측 24분+(prod 빌드 별도)이고, 여정 스펙이 늘수록 길어진다.
    # 40분은 재시도가 한 번만 붙어도 잘려서 결과를 못 보게 만든다(실측: 취소).
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workout_log_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm-node
      - uses: ./.github/actions/playwright-install

      - name: Run DB migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workout_log_ci
        run: pnpm db:migrate

      - name: Seed DB
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workout_log_ci
          WORKOUT_AUTH_USER_ID: 00000000-0000-4000-8000-000000c1c1c1
        run: pnpm db:seed

      # ⚠️ 이 레인은 **분리형(프록시) 토폴로지 전용 게이트**다. ci.yml의 E2E는
      # 인프로세스 모드(APPS_API_BASE 미설정, 프로덕션과 동일)로 돌기 때문에,
      # apps/api를 별도 프로세스로 띄우는 경로가 여전히 작동하는지 확인하는 곳은
      # 여기뿐이다. "언제든 다시 분리 배포할 수 있다"는 전제가 썩지 않게 하는 장치이니
      # 백엔드 기동 스텝과 APPS_API_BASE를 이 레인에서 걷어내지 말 것.
      # (같은 CI postgres를 보는 apps/api를 동반 기동한다.)
      - name: Start apps/api (standalone backend — proxy mode)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workout_log_ci
          PORT: "8787"
          # 아래 두 스위치는 E2E 스텝에만 걸려 있어 프록시 백엔드에는 적용되지 않았다.
          # /api/ux-events/public은 apps/api에 있고 분당 120회 한도라, 전체 스위트가
          # 한 러너 IP에서 페이지마다 web-vitals를 보내면 429가 나온다.
          WORKOUT_DISABLE_RATE_LIMIT: "1"
          WORKOUT_ALLOW_INSECURE_COOKIES: "1"
        run: |
          nohup node_modules/.bin/tsx src/index.ts > /tmp/apps-api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health > /dev/null 2>&1; then
              echo "apps/api up"; exit 0
            fi
            sleep 1
          done
          echo "apps/api failed to start"; cat /tmp/apps-api.log; exit 1

      - name: Run full E2E suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workout_log_ci
          WORKOUT_AUTH_USER_ID: 00000000-0000-4000-8000-000000c1c1c1
          # ci.yml과 같은 이유 — 이 레인도 prod 빌드다(web/src/server/auth/dev-fallback.ts).
          WORKOUT_WEB_ALLOW_ENV_AUTH: "1"
          APPS_API_BASE: http://127.0.0.1:8787
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
          NEXT_TELEMETRY_DISABLED: "1"
          # prod 빌드로 실행: dev 컴파일 지연이 타이밍 민감 스펙(async-ux·stats-1rm의
          # 지연 mock 창)을 상시 잡아먹던 것을 구조적으로 제거(smoke #494와 동일 전환).
          PLAYWRIGHT_SERVER_MODE: prod
          # prod 빌드는 세션 쿠키를 Secure로 굽는데 CI는 http://127.0.0.1 구동이라
          # 쿠키가 저장되지 않아 실계정 스펙 전부 401 → CI 한정 옵트아웃(session-cookie.ts).
          WORKOUT_ALLOW_INSECURE_COOKIES: "1"
          # 실계정 스펙 25+개가 한 러너 IP에서 signup → 5/hr 한도 429. CI 한정 해제.
          WORKOUT_DISABLE_RATE_LIMIT: "1"
          CI: "true"
        run: pnpm exec playwright test --project chromium

      - name: Dump apps/api log
        if: ${{ always() }}
        working-directory: .
        run: tail -100 /tmp/apps-api.log || true

      - name: Upload Playwright artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 14
