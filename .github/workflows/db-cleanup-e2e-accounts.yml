name: db-cleanup-e2e-accounts

# E2E 스펙은 매 실행마다 `<이름>-<suffix>@example.com`으로 새 계정을 가입시킨다. 격리는
# 그 덕이지만 계정이 스스로 줄지 않아 dev 스키마에 쌓인다(2026-09-01 최초 정리: 602개,
# 도메인 데이터 1만 행 이상).
#
# CI E2E는 러너 안의 임시 Postgres를 쓰고 끝나면 사라지므로 잔해를 남기지 않는다. 남는
# 곳은 DB_SCHEMA=dev로 Supabase를 보는 경로(로컬 실행·프리뷰)뿐이라, 주 1회면 충분하다.
#
# ⚠️ dev 스키마 전용이다. core의 cleanupE2eAccounts가 DB_SCHEMA!=="dev"면 쿼리를 내기
# 전에 던진다 — 같은 술어를 prod에 돌리면 @example.com을 쓰는 실제 사용자를 지운다.
on:
  schedule:
    # 매주 월요일 새벽 5시 KST (= 일요일 UTC 20시). 다른 DB 잡(19·20시 UTC 매일)과
    # 겹치지 않게 요일로 떨어뜨렸다.
    - cron: "0 20 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "지우지 않고 대상 수만 센다"
        type: boolean
        default: true
      min_age_hours:
        description: "이보다 최근에 만들어진 계정은 건드리지 않는다"
        type: string
        default: "24"

concurrency:
  group: db-cleanup-e2e-accounts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    name: E2E 계정 정리 (dev)
    runs-on: ubuntu-latest
    # 도달 불가한 DB가 한 시간을 매달리지 않도록.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm-node

      - name: Clean up E2E throwaway accounts
        env:
          # db-migrate의 dev 레인과 같은 시크릿·스키마 조합.
          DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
          DB_SCHEMA: dev
          # 스케줄 실행은 실제로 지운다. 수동 실행은 기본이 dry-run이라 눌러 보고 확인할 수 있다.
          E2E_ACCOUNT_CLEANUP_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          E2E_ACCOUNT_MIN_AGE_HOURS: ${{ github.event.inputs.min_age_hours || '24' }}
        run: pnpm db:cleanup:e2e-accounts
