name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "apps/**"
      - "packages/**"
      - ".github/workflows/**"
      - ".github/actions/**"
      - "deploy/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
  workflow_dispatch: {}

# PR당 최신 push만 실행 — 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Job 1: lint + typecheck + unit tests
  # 가장 빠른 피드백. 이 job이 통과해야 e2e 시작
  # ──────────────────────────────────────────────
  quality:
    name: Lint · Typecheck · Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      # 아래 REF5 범프 가드가 base...head diff를 읽으므로 얕은 체크아웃으로는 부족하다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm-node

      # 프로토콜 범프 PR이 nightly 스펙을 함께 갱신했는지 묻는다(#617이 놓쳐 엿새간 실패).
      - name: REF5 protocol bump ↔ nightly spec
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ref5-protocol-bump-e2e-guard.mjs

      - name: Lint
        run: pnpm lint

      - name: Design lint (Hard Rules baseline)
        run: pnpm lint:design

      - name: Typecheck
        run: pnpm typecheck

      # web 유닛 전부. 실행 대상은 러너가 디스크에서 찾으므로(scripts/unit-test-discovery.mjs)
      # 새 테스트 파일이 목록 누락으로 조용히 빠질 수 없다 — 예전엔 package.json에 손으로
      # 나열해서 #591의 session-labels.test.ts가 0개로 집계된 적이 있다. 일부 테스트가 db/client를
      # 전이적으로 import해 로드 시점에 DATABASE_URL을 요구하므로 더미를 준다(연결은 lazy, 실제 I/O 없음).
      - name: Unit tests
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci_unit
        run: pnpm test:unit

      # 처방 엔진(program-engine) 테스트. generateSession이 @/server/db/client를 로드 시점에
      # import해 DATABASE_URL을 요구하므로, 순수 처방 테스트지만 더미 URL로 import 가드만
      # 통과시킨다(실제 DB I/O 없음 — 연결은 lazy). operator 발산 회귀 등 안전 민감 처방을 CI 게이트로.
      - name: Program-engine tests
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci_program_engine
        run: pnpm test:program-engine

  # ──────────────────────────────────────────────
  # Job: apps/api typecheck + 경계 가드
  # apps/api는 @workout/core만 소비하고 tsx로 (컴파일 없이) 돈다 → core 리팩터가
  # 다른 게이트 없이 백엔드를 깨뜨릴 수 있어 자체 typecheck가 필요하다.
  # lint:boundary는 "언제든 다시 분리 배포한다"는 전제를 코드로 고정한다: web이
  # app.ts를 인프로세스로 마운트해도 @/·next·react가 스며들면 안 되고(framework),
  # node 전용 서버 어댑터는 standalone 엔트리 index.ts에만 있어야 한다(server-entry).
  # 워크스페이스 루트 install 한 번으로 web·apps/api·packages/core 의존이 모두 깔린다.
  # ──────────────────────────────────────────────
  apps-api:
    name: apps/api Typecheck · Boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm-node

      - name: Typecheck apps/api
        working-directory: apps/api
        run: pnpm typecheck

      - name: Boundary lint apps/api
        working-directory: apps/api
        run: pnpm lint:boundary

      - name: any ratchet apps/api
        working-directory: apps/api
        run: pnpm lint:no-any

      # 종전에는 apps/api에 test 스크립트도 CI 스텝도 없어서, 존재하던 테스트 파일
      # (ref5-plan-creation)이 **한 번도 안 돌고 있었다**. 글롭 발견이라 새 테스트는
      # 자동으로 편입된다 — packages/core와 같은 방식.
      - name: Test apps/api
        working-directory: apps/api
        run: pnpm test

  # ──────────────────────────────────────────────
  # Job: apps/mcp typecheck + boundary + smoke
  # MCP 서버는 공개 API를 HTTP로만 부르는 얇은 래퍼다. 경계 가드가 core·DB 직접
  # 접근을 막고(배포 독립성), 스모크가 실제 MCP 프로토콜을 태운다.
  # ──────────────────────────────────────────────
  mcp:
    name: apps/mcp Typecheck · Boundary · Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm-node

      - name: Typecheck apps/mcp
        working-directory: apps/mcp
        run: pnpm typecheck

      - name: Boundary lint apps/mcp
        working-directory: apps/mcp
        run: pnpm lint:boundary

      - name: Test apps/mcp
        working-directory: apps/mcp
        run: pnpm test

  # ──────────────────────────────────────────────
  # Job: packages/core typecheck + test
  # web·apps/api가 공유하는 source-only 패키지. 자체 게이트로 드리프트 조기 검출.
  # ──────────────────────────────────────────────
  core:
    name: packages/core Typecheck · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm-node

      - name: Typecheck packages/core
        working-directory: packages/core
        run: pnpm typecheck

      - name: Boundary lint packages/core
        working-directory: packages/core
        run: pnpm lint:boundary

      # web은 eslint(no-explicit-any)로 0건이 강제되지만 core·apps/api엔 eslint가 없다.
      # 남은 any를 파일별 허용치로 못박아 새로 늘어나는 것만 막는다(허용 목록은 줄어들기만 한다).
      - name: any ratchet packages/core
        working-directory: packages/core
        run: pnpm lint:no-any

      - name: Test packages/core
        working-directory: packages/core
        run: pnpm test

  bundle-budget:
    name: Next.js Client Bundle Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm-node

      - name: Analyze route client graphs
        working-directory: web
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci_bundle_analysis
          NEXT_TELEMETRY_DISABLED: "1"
        run: pnpm analyze:bundle

  # ──────────────────────────────────────────────
  # Job: TUI (apps/tui) build · vet · test
  # Go tests were previously developer-run only (never gated). live_test.go is
  # env-gated (IRONLOG_SPIKE_URL) and skips here — unit/snapshot tests run.
  # ──────────────────────────────────────────────
  tui:
    name: TUI Build · Vet · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/tui/go.mod
          cache-dependency-path: apps/tui/go.sum

      - name: Build
        working-directory: apps/tui
        run: go build ./...

      - name: Vet
        working-directory: apps/tui
        run: go vet ./...

      - name: Test
        working-directory: apps/tui
        run: go test ./...

  # ──────────────────────────────────────────────
  # Job 2: Playwright smoke E2E (프로덕션 빌드 대상)
  # quality 통과 후 실행. PostgreSQL 서비스 컨테이너 + `next build && next start`.
  # 과거엔 next dev로 돌려 빌드 시간을 아꼈으나(빌드는 Vercel Preview가 담당), dev는
  # 관대해 RSC 직렬화 크래시 등 "프로덕션 빌드에서만 터지는 렌더 에러"를 못 잡았다
  # (#491 F4 사고: AppCopy를 서버→클라 prop으로 넘겨 홈 SSR 크래시, dev·번들 grep·Vercel
  # 빌드 모두 통과 → prod에서만 노출). 스모크를 prod 빌드로 돌려 이 클래스를 머지 전에 게이트.
  # ──────────────────────────────────────────────
  e2e-smoke:
    name: E2E Smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workout_log_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-pnpm-node
      - uses: ./.github/actions/playwright-install

      - name: Run DB migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workout_log_ci
        run: pnpm db:migrate

      - name: Verify workout log idempotency
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workout_log_ci
        run: pnpm db:verify:workout-log-idempotency

      - name: Verify account lifecycle barrier
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workout_log_ci
        run: pnpm db:verify:account-lifecycle

      # 저장된 기록이 가리키는 처방 스냅샷이 재생성으로 덮어써지지 않는지(#648). 가드가
      # upsert SQL 안에 있어 유닛 하네스(DB 없음)로는 검증되지 않는다 — 이 잡의 Postgres가
      # 유일한 게이트다. 픽스처는 자체 생성·정리라 seed 전후 어디서 돌아도 무관.
      - name: Verify generated session immutability
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workout_log_ci
        run: pnpm db:verify:generated-session-immutability

      - name: Seed DB
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workout_log_ci
          WORKOUT_AUTH_USER_ID: 00000000-0000-4000-8000-000000c1c1c1
          # E2E의 신원은 이 폴백 계정 하나뿐이라, 관리자 표면(/settings/debug 등)을
          # 훑는 스펙이 돌려면 관리자여야 한다. 시드는 이 플래그가 있을 때만 승격하며
          # prod 시드 잡(db-seed.yml)은 세우지 않는다 — packages/core/src/db/seed.ts 참조.
          WORKOUT_SEED_ADMIN_FALLBACK: "1"
        run: pnpm db:seed

      # 데이터 라우트(/api/plans 등)는 catch-all이 처리한다. APPS_API_BASE를 주지
      # 않으므로 **인프로세스 모드** — web이 Hono 앱을 직접 마운트한다(#634). 별도
      # 백엔드 프로세스가 없어야 프로덕션이 도는 방식과 같아진다.
      #
      # 분리형(프록시) 토폴로지는 e2e-nightly.yml이 apps/api를 동반 기동해 계속
      # 증명한다 — 두 레인이 두 모드를 나눠 맡는 구조이고, 그래서 언제든 다시
      # 분리 배포해도 "지금도 되나?"를 새로 확인할 필요가 없다.
      #
      # (백엔드 없이 돌리면 프로그램 시작 흐름 스펙이 구조적으로 실패하던 시절
      #  버튼·운동명 개명 회귀가 PR을 그대로 통과한 적이 있다(#582). 이제는
      #  백엔드가 web 안에 있어 그 스펙이 항상 돈다.)

      # PLAYWRIGHT_SERVER_MODE=prod → webServer가 `pnpm build && pnpm start`(프로덕션 런타임).
      # build가 migrate를 재실행하나 멱등(위 seed는 여전히 필요). prod 렌더 크래시를 여기서 게이트.
      # design-harmonization을 여기 넣는 이유: 이 스펙이 **디자인 회귀를 잡는 유일한
      # 게이트**인데 nightly 전용이라, 고치는 사람이 머지 전에 확인하려면 nightly를
      # 수동으로 돌려 10분 넘게 기다려야 했다(실제로 그렇게 했다). 잡 시간이 ~2.5분
      # 늘지만, 디자인 변경이 PR에서 판정된다.
      #
      # admin-surface-boundary도 같은 이유로 PR 게이트다 — 관리자 표면(디버그 페이지·
      # 마이그레이션 텔레메트리)이 일반 계정에 열리는 회귀는 머지 후에 발견하면 늦다.
      # 이 레인은 실계정 가입이 도는 조건(쿠키·레이트리밋 완화)을 이미 갖췄다.
      - name: Run smoke + accessibility + theme + design E2E tests (prod build, in-process API)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workout_log_ci
          WORKOUT_AUTH_USER_ID: 00000000-0000-4000-8000-000000c1c1c1
          # 이 레인은 prod 빌드라 NODE_ENV=production이고, web의 개발용 인증 폴백은
          # 거기서 기본 차단된다. E2E는 그 폴백에 의존하므로 여기서만 명시 opt-in 한다
          # (web/src/server/auth/dev-fallback.ts). Vercel 프로덕션에는 세우지 않는다.
          WORKOUT_WEB_ALLOW_ENV_AUTH: "1"
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
          NEXT_TELEMETRY_DISABLED: "1"
          PLAYWRIGHT_SERVER_MODE: prod
          # prod 빌드는 세션 쿠키를 Secure로 굽는데 CI는 http로 뜬다 — 실계정 스펙이
          # 쿠키를 못 받아 전부 401이 되는 것을 CI 한정으로 푼다(nightly와 동일).
          WORKOUT_ALLOW_INSECURE_COOKIES: "1"
          WORKOUT_DISABLE_RATE_LIMIT: "1"
          CI: "true"
        run: pnpm exec playwright test e2e/smoke.spec.ts e2e/program-start-smoke.spec.ts e2e/a11y-runtime.spec.ts e2e/stale-session-redirect.spec.ts e2e/color-themes.spec.ts e2e/design-harmonization.spec.ts e2e/pull-to-refresh.spec.ts e2e/link-navigation.spec.ts e2e/admin-surface-boundary.spec.ts --project chromium

      # 실패 시 trace/screenshot/video를 artifact로 보관
      - name: Upload Playwright artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 14
